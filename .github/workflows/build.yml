name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - run: python3 tools/prep_dep.py libs/CinematicInteraction-0.1-Fabric-1.21.1.jar build-dep/mod-dep.jar
      - name: Gradle build
        run: gradle build --no-daemon > build.log 2>&1
      - name: Publish log on failure
        if: failure()
        run: |
          mkdir /tmp/l && cp build.log /tmp/l/ && cd /tmp/l && git init -q -b ci-log && git config user.name ci && git config user.email ci@x.y
          git add -A && git commit -qm log && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log
      - name: Patch original jar
        run: |
          ADDON=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)
          mkdir -p dist
          python3 tools/patch_jar.py libs/CinematicInteraction-0.1-Fabric-1.21.1.jar "$ADDON" dist/CinematicInteraction-0.1-Fabric-1.21.1-client.jar
          unzip -p dist/*.jar fabric.mod.json | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: CinematicInteraction-client
          path: dist/*.jar
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar --title "Cinematic Interactions (client-side build)" --notes "Auto-built from main."
  sources:
    # one-off helper: dumps named (Mojang-mapped) sources of the original mod so they can be read
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - run: gradle build --no-daemon
      - run: |
          curl -sL -o vf.jar https://github.com/Vineflower/vineflower/releases/download/1.10.1/vineflower-1.10.1.jar
          RM=$(find ~/.gradle . -path '*remapped_mods*' -name '*.jar' | grep -i cinematic | head -1); echo "$RM"
          mkdir -p out/mod; java -jar vf.jar -log=ERROR "$RM" out/mod
          MC=$(find ~/.gradle . -name 'minecraft-*sources*.jar' | head -1); echo "$MC"
          mkdir -p out/mc && cd out/mc && unzip -q "$MC" && cd ../..
      - run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan named-sources; git rm -rf . -q || true
          mv out/mod mod-named; mkdir mc-named; cp -r out/mc/net/minecraft/world/inventory out/mc/net/minecraft/client/multiplayer out/mc/net/minecraft/network/protocol/game mc-named/ || true
          rm -rf out vf.jar libs build .gradle
          git add -A; git commit -qm "named sources"; git push -f origin named-sources
